name: DB Backup

on:
  schedule:
    - cron: '0 18 * * *'  # 毎日 JST 3:00 (UTC 18:00)
  workflow_dispatch:       # 手動実行も可能

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install MySQL client
        run: sudo apt-get install -y mysql-client

      - name: Dump database
        env:
          MYSQL_PUBLIC_URL: ${{ secrets.MYSQL_PUBLIC_URL }}
        run: |
          # mysql://user:pass@host:port/dbname を分解
          DB_USER=$(echo "$MYSQL_PUBLIC_URL" | sed 's|mysql://\([^:]*\):.*|\1|')
          DB_PASS=$(echo "$MYSQL_PUBLIC_URL" | sed 's|mysql://[^:]*:\([^@]*\)@.*|\1|')
          DB_HOST=$(echo "$MYSQL_PUBLIC_URL" | sed 's|.*@\([^:/]*\)[:/].*|\1|')
          DB_PORT=$(echo "$MYSQL_PUBLIC_URL" | sed 's|.*@[^:]*:\([0-9]*\)/.*|\1|')
          DB_NAME=$(echo "$MYSQL_PUBLIC_URL" | sed 's|.*/\([^?]*\).*|\1|')

          BACKUP_FILE="backup_$(date +%Y%m%d_%H%M%S).sql"

          mysqldump \
            -h "$DB_HOST" \
            -P "$DB_PORT" \
            -u "$DB_USER" \
            -p"$DB_PASS" \
            --ssl-mode=REQUIRED \
            --single-transaction \
            --routines \
            --triggers \
            --max-allowed-packet=512M \
            --net-buffer-length=32768 \
            "$DB_NAME" > "$BACKUP_FILE"

          gzip "$BACKUP_FILE"
          echo "Backup complete: ${BACKUP_FILE}.gz"
          ls -lh "${BACKUP_FILE}.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}-${{ github.run_id }}
          path: "*.sql.gz"
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: echo "::error::DB バックアップに失敗しました"
