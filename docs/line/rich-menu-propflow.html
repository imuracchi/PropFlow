<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:2500px;height:1686px;overflow:hidden;background:#edf2f7;font-family:"Noto Sans JP",sans-serif;color:#142c49}
.menu{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr;width:2500px;height:1686px;gap:7px;background:#d7e0ea}
.item{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:27px;grid-column:span 2;padding:96px 72px 68px;overflow:hidden;background:#fff;text-align:left}
.item:after{content:"";position:absolute;z-index:-1;width:360px;height:360px;right:-150px;bottom:-180px;border:3px solid currentColor;border-radius:50%;opacity:.08}
.item:first-child{grid-column:1/-1;flex-direction:row;align-items:center;gap:70px;padding:118px 190px 68px;background:linear-gradient(125deg,#102f55 0%,#1b4f87 66%,#23649d 100%);color:#fff}
.item:first-child:before{content:"";position:absolute;z-index:-1;width:980px;height:980px;right:-260px;top:-620px;border:70px solid rgba(255,255,255,.055);border-radius:50%}
.item:first-child:after{width:720px;height:720px;right:-250px;bottom:-490px;border-width:45px;opacity:.06}
.item:nth-child(2){background:linear-gradient(145deg,#eef4fb,#fff);color:#173f70}
.item:nth-child(3){background:linear-gradient(145deg,#f8fafc,#fff);color:#243b57}
.item:nth-child(4){background:linear-gradient(145deg,#eaf8ef,#f9fffb);color:#0b7139}
.icon{display:grid;place-items:center;width:118px;height:118px;flex:0 0 118px;border:4px solid currentColor;border-radius:30px;background:rgba(255,255,255,.72);box-shadow:0 18px 40px rgba(20,44,73,.08)}
.icon svg{width:62px;height:62px;fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.item:first-child .icon{width:176px;height:176px;flex-basis:176px;border-color:rgba(255,255,255,.9);background:rgba(255,255,255,.08);box-shadow:none}.item:first-child .icon svg{width:92px;height:92px}
.label{font-size:104px;font-weight:900;letter-spacing:-.045em;line-height:1.13;white-space:nowrap}
.item:first-child .label{font-size:164px}
.item:nth-child(3) .label{font-size:110px}
.item:nth-child(4) .label{font-size:96px}
.sub{margin-top:15px;font-size:31px;font-weight:500;letter-spacing:.01em;line-height:1.5;opacity:.65;white-space:nowrap}
.item:first-child .sub{font-size:34px;color:#d9e9f8;opacity:.9}
.arrow{position:absolute;right:64px;bottom:48px;display:grid;place-items:center;width:58px;height:58px;border:2px solid currentColor;border-radius:50%;font-size:38px;font-weight:500;line-height:1;opacity:.38}
.brand{position:absolute;left:72px;top:62px;font-size:24px;font-weight:900;letter-spacing:.16em;opacity:.55}
.item:first-child .brand{left:190px;top:74px;font-size:32px;color:#fff;opacity:.92}
.item:first-child .brand:after{content:"  /  BUYER MENU";font-weight:500;letter-spacing:.1em;opacity:.55}
</style>
</head>
<body>
<main class="menu">
  <section class="item">
    <span class="brand">PropFlow</span>
    <div class="icon"><svg viewBox="0 0 100 100"><circle cx="44" cy="44" r="27"/><path d="m64 64 22 22"/><path d="M32 44h24M44 32v24"/></svg></div>
    <div><div class="label">物件を探す</div><div class="sub">条件を指定して、気になる物件を見つける</div></div><span class="arrow">›</span>
  </section>
  <section class="item">
    <div class="icon"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34"/><circle cx="50" cy="50" r="17"/><circle cx="50" cy="50" r="4"/><path d="M50 5v11M50 84v11M5 50h11M84 50h11"/></svg></div>
    <div><div class="label">物件を募集</div><div class="sub">希望条件を登録する</div></div><span class="arrow">›</span>
  </section>
  <section class="item">
    <span class="brand">ABOUT</span>
    <div class="icon"><svg viewBox="0 0 100 100"><path d="M24 12h40l14 14v62H24z"/><path d="M64 12v16h14M37 45h28M37 59h28M37 73h18"/></svg></div>
    <div><div class="label">PropFlow</div><div class="sub">サービスについて知る</div></div><span class="arrow">›</span>
  </section>
  <section class="item">
    <span class="brand">SUPPORT</span>
    <div class="icon"><svg viewBox="0 0 100 100"><path d="M18 22h64v45H46L29 82V67H18z"/><path d="M35 43h30M35 55h20"/></svg></div>
    <div><div class="label">ヘルプ・相談</div><div class="sub">使い方・よくある質問</div></div><span class="arrow">›</span>
  </section>
</main>
</body>
</html>
