services:
  propflow-test-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_DATABASE: propflow_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptestpass"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - propflow-test-mysql:/var/lib/mysql

volumes:
  propflow-test-mysql:
